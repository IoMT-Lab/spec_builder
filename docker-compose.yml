version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"  # Backend
      - "5173:5173"  # Frontend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./sessions:/app/sessions
      - ./Documents:/app/Documents
    restart: unless-stopped
